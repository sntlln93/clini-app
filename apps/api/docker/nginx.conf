worker_processes auto;
pid /run/nginx.pid;
# Out of the container's unrotated file, and only at crit: an error entry
# carries the request line and the Referer, query string included (#322).
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    # A request line carries searches (?q= with a name or DNI) and bearer
    # tokens in the path (/booking/appointments/<token>), and this file sat
    # unrotated in the container with no reader (#322).
    access_log off;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
