# Pinned for the same reason as apps/api/compose.yaml: keeps this on the
# same Compose project as the root compose.yaml's `include`, whether it's
# started from there or standalone (`cd apps/panel && docker compose up`).
name: clini-app
services:
    panel:
        image: 'node:24-bookworm-slim'
        # The npm workspace root (repo root) is mounted, not just apps/panel,
        # so `npm install` sees the workspace lockfile.
        working_dir: /workspace
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        ports:
            - '${PANEL_PORT:-5174}:5174'
        environment:
            HOME: /tmp
        volumes:
            - '../..:/workspace'
        networks:
            - sail
        command: sh -c "npm install && npm run dev --workspace=apps/panel"
networks:
    sail:
        driver: bridge
