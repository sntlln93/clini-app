# Pinned for the same reason as apps/api/compose.yaml: keeps this on the
# same Compose project as the root compose.yaml's `include`, whether it's
# started from there or standalone (`cd apps/panel && docker compose up`).
name: clini-app
services:
    # One-shot: a fresh named volume is created root-owned, which the panel
    # service below (running as WWWUSER, not root) couldn't write into. This
    # runs once as root before panel starts and exits; `chown -R` on an
    # already-correct tree on later restarts is a cheap no-op.
    panel-node-modules-init:
        image: 'node:24-bookworm-slim'
        volumes:
            - 'panel_node_modules:/node_modules'
        command: chown -R ${WWWUSER:-1000}:${WWWGROUP:-1000} /node_modules
    panel:
        image: 'node:24-bookworm-slim'
        # Only apps/panel plus the two root manifests (and the sibling
        # dashboard's package.json, see below) are mounted (not the whole
        # repo root): the workspace lockfile is indexed by workspace
        # path, so npm still needs both manifests present at /workspace to
        # resolve the apps/panel workspace correctly.
        working_dir: /workspace
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        depends_on:
            panel-node-modules-init:
                condition: service_completed_successfully
        ports:
            - '${PANEL_PORT:-5174}:5174'
        environment:
            HOME: /tmp
        volumes:
            - '.:/workspace/apps/panel'
            - '../../package.json:/workspace/package.json'
            - '../../package-lock.json:/workspace/package-lock.json'
            # The sibling workspace's manifest only (read-only). With both
            # apps listed in the root `workspaces`, a workspace folder missing
            # on disk makes npm treat the lockfile as out of sync and rewrite
            # the bind-mounted root package-lock.json without the sibling's
            # entries. The filtered install below still installs only this
            # workspace's dependencies.
            - '../dashboard/package.json:/workspace/apps/dashboard/package.json:ro'
            - '../landing/package.json:/workspace/apps/landing/package.json:ro'
            # The shared workspace packages (packages/*, e.g. @clini/theme).
            # Read-write like the app itself: they're source edited on the
            # host, and the root `workspaces` lists them, so npm needs their
            # package.json on disk too. Vite resolves them through the
            # node_modules symlink and watches the real path, so a change
            # here reaches the dev server by HMR.
            - '../../packages:/workspace/packages'
            # Overlaid on top of the bind mounts above: node_modules holds
            # platform-specific native bindings (e.g. rolldown's), so it
            # can't be shared as-is between the host (macOS) and this
            # container (Linux) without one install clobbering the other's
            # binary every time either side runs `npm install`.
            - 'panel_node_modules:/workspace/node_modules'
        networks:
            - sail
        command: sh -c "npm install --workspace=apps/panel --include-workspace-root=false && npm run dev --workspace=apps/panel"
networks:
    sail:
        driver: bridge
volumes:
    panel_node_modules:
        driver: local
