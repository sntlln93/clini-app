# Root entrypoint for local dev: brings up every service (api + panel + db)
# in one project. Each app owns its own compose file — this one only wires
# them together via `include`, which merges services/networks as if they
# were declared here directly (relative paths inside each included file
# still resolve against that file's own directory, not this one).
#
# `env_file` on the api entry is required because docker compose otherwise
# looks for a `.env` next to *this* file (the repo root), not next to the
# included one — apps/api/.env holds the real DB_DATABASE/DB_USERNAME it
# has no fallback for. apps/panel/compose.yaml needs no env_file: every var
# it interpolates (WWWUSER, WWWGROUP, PANEL_PORT) has a `:-default` inline,
# and pointing it at apps/api/.env would be borrowing a file that isn't
# semantically its own (that path is apps/panel/.env's job, for Vite).
#
#   docker compose up            # api + panel + pgsql
#   docker compose up panel      # just the frontend dev server
#
# `./vendor/bin/sail` (run from apps/api) still works for artisan/pest and
# only targets apps/api/compose.yaml (laravel.test + pgsql) — it has no
# notion of this file or of the panel service.
include:
    - path: apps/api/compose.yaml
      env_file: apps/api/.env
    - path: apps/panel/compose.yaml

# e2e isn't a deployable app like api/panel (no Dockerfile of its own), so it
# lives directly here rather than in its own compose file. Behind the `e2e`
# profile so `docker compose up` never starts it by itself — run explicitly
# with `docker compose --profile e2e up --abort-on-container-exit e2e`.
#
# Mirrors CI exactly rather than pointing at the persistent laravel.test/panel
# containers: apps/panel's dev bundle bakes VITE_API_URL=http://localhost:8080
# at build time (see apps/panel/.env), which is only ever correct from inside
# whatever single process/network namespace is also running the api server —
# true on a bare CI runner, never true for a browser driven from a *different*
# container than the one serving it. So `CI=true` here makes
# playwright.config.ts spawn its own `php artisan serve` + `vite dev` inside
# this same container (its existing `webServer` array, otherwise CI-only),
# and everything resolves over plain `localhost` exactly like CI does. Reuses
# the already-built `sail-8.5/app` image (apps/api/vendor/laravel/sail/…):
# it already bundles PHP 8.5, Node 24 and Playwright's system deps, so this
# needs no Dockerfile of its own — and its `start-container` entrypoint
# already drops from root to $WWWUSER via gosu, so files written into the
# bind-mounted repo (composer/npm installs, playwright traces) stay
# host-owned without any extra chown step.
services:
    pgsql-e2e:
        image: 'postgres:18-alpine'
        profiles:
            - e2e
        environment:
            POSTGRES_DB: testing
            POSTGRES_USER: sail
            POSTGRES_PASSWORD: password
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - testing
                - '-U'
                - sail
            retries: 3
            timeout: 5s
    e2e:
        image: 'sail-8.5/app'
        profiles:
            - e2e
        working_dir: /workspace
        depends_on:
            pgsql-e2e:
                condition: service_healthy
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            HOME: /tmp
            CI: 'true'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql-e2e
            DB_PORT: 5432
            DB_DATABASE: testing
            DB_USERNAME: sail
            DB_PASSWORD: password
            # Assertions may end up matching the Spanish UI, same as CI.
            APP_LOCALE: es
        volumes:
            - '.:/workspace'
        networks:
            - sail
        command: >
            sh -c "cd apps/api && composer install --no-interaction --prefer-dist &&
            php artisan migrate --force && php artisan db:seed --force && cd /workspace &&
            npm install &&
            npx playwright install chromium &&
            npx playwright test"
