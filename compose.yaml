# Root entrypoint for local dev: brings up every service (api + panel +
# dashboard + landing + db) in one project. Each app owns its own compose file — this one only wires
# them together via `include`, which merges services/networks as if they
# were declared here directly (relative paths inside each included file
# still resolve against that file's own directory, not this one).
#
# `env_file` on the api entry is required because docker compose otherwise
# looks for a `.env` next to *this* file (the repo root), not next to the
# included one — apps/api/.env holds the real DB_DATABASE/DB_USERNAME it
# has no fallback for. apps/panel/compose.yaml and apps/dashboard/compose.yaml
# need no env_file: every var they interpolate (WWWUSER, WWWGROUP,
# PANEL_PORT, DASHBOARD_PORT, LANDING_PORT) has a `:-default` inline, and pointing them at
# apps/api/.env would be borrowing a file that isn't semantically their own
# (that path is each app's own .env, for Vite).
#
# Both frontends bind-mount the root package-lock.json. With an in-sync
# lockfile (and each container seeing its sibling's package.json, see the
# app compose files) `npm install` doesn't rewrite it, so starting both at
# once is safe — after a dependency change, regenerate the lockfile first
# (the disposable-container `npm install` in CLAUDE.md), then `up`.
#
#   docker compose up              # api + panel (:5174) + dashboard (:5175) + landing (:5176) + pgsql
#   docker compose up panel        # just the clinic panel dev server
#   docker compose up dashboard    # just the platform dashboard dev server
#   docker compose up landing      # just the public landing dev server (:5176, SSR)
#
# `./vendor/bin/sail` (run from apps/api) still works for artisan/pest and
# only targets apps/api/compose.yaml (laravel.test + pgsql) — it has no
# notion of this file or of the panel service.
include:
    - path: apps/api/compose.yaml
      env_file: apps/api/.env
    - path: apps/panel/compose.yaml
    - path: apps/dashboard/compose.yaml
    - path: apps/landing/compose.yaml

# e2e isn't a deployable app like api/panel (no Dockerfile of its own), so it
# lives directly here rather than in its own compose file. Behind the `e2e`
# profile so `docker compose up` never starts it by itself — run explicitly
# with `docker compose --profile e2e up --abort-on-container-exit e2e`.
#
# Mirrors CI exactly rather than pointing at the persistent laravel.test/panel
# containers: apps/panel's dev bundle bakes VITE_API_URL=http://localhost:8080
# at build time (see apps/panel/.env), which is only ever correct from inside
# whatever single process/network namespace is also running the api server —
# true on a bare CI runner, never true for a browser driven from a *different*
# container than the one serving it. So `CI=true` here makes
# playwright.config.ts spawn its own `php artisan serve` + `vite dev` inside
# this same container (its existing `webServer` array, otherwise CI-only),
# and everything resolves over plain `localhost` exactly like CI does. Reuses
# the already-built `sail-8.5/app` image (apps/api/vendor/laravel/sail/…):
# it already bundles PHP 8.5, Node 24 and Playwright's system deps, so this
# needs no Dockerfile of its own — and its `start-container` entrypoint
# already drops from root to $WWWUSER via gosu, so files written into the
# bind-mounted repo (composer/npm installs, playwright traces) stay
# host-owned without any extra chown step.
services:
    pgsql-e2e:
        image: 'postgres:18-alpine'
        profiles:
            - e2e
        environment:
            POSTGRES_DB: testing
            POSTGRES_USER: sail
            POSTGRES_PASSWORD: password
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - testing
                - '-U'
                - sail
            retries: 3
            timeout: 5s
    e2e:
        image: 'sail-8.5/app'
        profiles:
            - e2e
        working_dir: /workspace
        depends_on:
            pgsql-e2e:
                condition: service_healthy
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            HOME: /tmp
            CI: 'true'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql-e2e
            DB_PORT: 5432
            DB_DATABASE: testing
            DB_USERNAME: sail
            DB_PASSWORD: password
            # Assertions may end up matching the Spanish UI, same as CI.
            APP_LOCALE: es
            # Same values as the CI e2e job: the dashboard (:5175) is a
            # second stateful SPA origin, and the only origin allowed on the
            # admin routes. Exported env wins over apps/api/.env (Dotenv
            # never overrides an existing variable), so a dev's local .env
            # can't break the run.
            FRONTEND_URL: 'http://localhost:5174,http://localhost:5175'
            SANCTUM_STATEFUL_DOMAINS: 'localhost:5174,localhost:5175'
            ADMIN_ALLOWED_ORIGINS: 'http://localhost:5175'
        volumes:
            - '.:/workspace'
        networks:
            - sail
        command: >
            sh -c "cd apps/api && composer install --no-interaction --prefer-dist &&
            php artisan migrate --force && php artisan db:seed --force && cd /workspace &&
            npm install &&
            cp -n apps/dashboard/.env.example apps/dashboard/.env &&
            cp -n apps/landing/.env.example apps/landing/.env &&
            npx playwright install chromium &&
            npx playwright test"
