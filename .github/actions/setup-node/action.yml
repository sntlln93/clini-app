name: Setup Node
description: Node.js with the npm workspace installed (full root, or apps/panel only via the `scope` input). Single source of truth for the Node version.

inputs:
  scope:
    description: 'Install scope: `workspace-root` (full monorepo install) or `panel` (apps/panel only).'
    required: false
    default: workspace-root

runs:
  using: composite
  steps:
    - name: ⚙️ Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 📦 npm install
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      run: |
        case "$SCOPE" in
          workspace-root)
            npm ci
            ;;
          panel)
            npm ci --workspace=apps/panel --include-workspace-root=false
            ;;
          *)
            echo "::error::Unrecognized setup-node scope: $SCOPE"
            exit 1
            ;;
        esac
