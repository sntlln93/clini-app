name: Setup Node
description: Node.js with the npm workspace installed (full root, or only the frontend apps via the `scope` input). Single source of truth for the Node version.

inputs:
  scope:
    description: 'Install scope: `workspace-root` (full monorepo install) or `frontends` (apps/panel + apps/dashboard + apps/landing and the shared packages/* they depend on, e.g. @clini/theme; no root e2e deps).'
    required: false
    default: workspace-root

runs:
  using: composite
  steps:
    - name: ⚙️ Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 📦 npm install
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      run: |
        case "$SCOPE" in
          workspace-root)
            npm ci
            ;;
          frontends)
            # The shared packages/* (e.g. @clini/theme) come in as workspace
            # dependencies of the apps that use them: npm links them and
            # installs their own dependencies without listing them here.
            npm ci --workspace=apps/panel --workspace=apps/dashboard --workspace=apps/landing --include-workspace-root=false
            ;;
          *)
            echo "::error::Unrecognized setup-node scope: $SCOPE"
            exit 1
            ;;
        esac
