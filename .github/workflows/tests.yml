name: Tests

on:
  pull_request:
    branches: [develop, main]
  # Pushes to the long-lived branches keep the README badges reporting
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests_backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: 📥 Clone repo
        uses: actions/checkout@v7

      - name: ⚙️ PHP + composer
        uses: ./.github/actions/setup-php

      - name: ⚡ Setup Laravel
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      # Architecture violations are static (no DB) and cheap, so they run
      # first as a fast-fail gate before the slower feature suite.
      - name: 🏛️ Arch tests
        working-directory: apps/api
        run: php artisan test --testsuite=Arch

      - name: 🧪 Pest
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: php artisan test

  tests_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clone repo
        uses: actions/checkout@v7

      - name: ⚙️ Node.js + npm
        uses: ./.github/actions/setup-node
        with:
          scope: frontends

      # GitHub Actions sets CI=true, so each parity test reads the PHP
      # ErrorCode enum (apps/api is checked out here) and fails loudly if not.
      - name: 🧪 Vitest (panel)
        working-directory: apps/panel
        run: npm run test

      - name: 🧪 Vitest (dashboard)
        working-directory: apps/dashboard
        run: npm run test

      - name: 🧪 Vitest (landing)
        working-directory: apps/landing
        run: npm run test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      # Assertions may end up matching the Spanish UI
      APP_LOCALE: es
      # The dashboard (:5175) is a second stateful SPA origin and the only
      # origin allowed on /api/v1/admin/*. Job env wins over apps/api/.env
      # (Dotenv never overrides an existing variable), and `php artisan serve
      # --no-reload` passes it through to the app.
      FRONTEND_URL: http://localhost:5174,http://localhost:5175
      SANCTUM_STATEFUL_DOMAINS: localhost:5174,localhost:5175
      ADMIN_ALLOWED_ORIGINS: http://localhost:5175

    steps:
      - name: 📥 Clone repo
        uses: actions/checkout@v7

      - name: ⚙️ PHP + composer
        uses: ./.github/actions/setup-php

      - name: ⚡ Setup Laravel
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force

      - name: ⚙️ Node.js + npm
        uses: ./.github/actions/setup-node
        with:
          scope: workspace-root

      # Static checks over e2e/**/*.ts + playwright.config.ts (same scope as
      # e2e/tsconfig.json). They run before the browser install so a style-only
      # failure doesn't pay for Playwright's download.
      - name: 🎨 Prettier
        run: npm run format:check

      - name: 🔍 ESLint
        run: npm run lint:check

      - name: ⚡ Setup panel env
        run: cp apps/panel/.env.example apps/panel/.env

      - name: ⚡ Setup dashboard env
        run: cp apps/dashboard/.env.example apps/dashboard/.env

      - name: ⚡ Setup landing env
        run: cp apps/landing/.env.example apps/landing/.env

      - name: ♻️ Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # No --with-deps: ubuntu-latest already ships the Chromium system deps
      - name: 🌐 Playwright browsers
        run: npx playwright install chromium

      - name: 🛠️ Type-check specs
        run: npx tsc -p e2e --noEmit

      # playwright.config.ts boots the servers itself (webServer array) when
      # CI is set — php artisan serve for the api, vite dev for the panel,
      # the dashboard and the landing
      - name: 🧪 E2E tests
        run: npx playwright test

      - name: 📤 Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
